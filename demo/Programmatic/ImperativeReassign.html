<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic imperative reassign</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        class WorldRanking extends HTMLElement{
            propagator = new EventTarget();
            #list = [
                {rank: 1, noc: 'USA', gold: 40, silver: 44, bronze: 42, total: 126},
                {rank: 2, noc: 'China', gold: 40, silver: 27, bronze: 24, total: 91},
            ];
            get list(){ return this.#list; }
            set list(nv){
                this.#list = nv;
                this.propagator.dispatchEvent(new Event('list'));
            }
            #paralympics = [
                {rank: 1, noc: 'China', gold: 94, silver: 76, bronze: 50, total: 220},
            ];
            get paralympics(){ return this.#paralympics; }
            set paralympics(nv){
                this.#paralympics = nv;
                this.propagator.dispatchEvent(new Event('paralympics'));
            }
            addItem(item){
                this.list = [...this.#list, item];
            }
        }
        customElements.define('world-ranking', WorldRanking);
    </script>
</head>
<body>
    <world-ranking id=rankings></world-ranking>
    <table>
        <thead><tr><th>Rank</th><th>NOC</th><th>Gold</th><th>Silver</th><th>Bronze</th><th>Total</th></tr></thead>
        <tbody id=tbody>
            <tr>
                <td itemprop="rank"></td>
                <td itemprop="noc"></td>
                <td itemprop="gold"></td>
                <td itemprop="silver"></td>
                <td itemprop="bronze"></td>
                <td itemprop="total"></td>
            </tr>
        </tbody>
    </table>
    <script type=module>
        import {defThreePeat} from '/def.js';
        const emc = await defThreePeat(document.body);
        const threePeat = tbody.enh.get(emc);
        Object.assign(threePeat, {src: 'rankings', listProp: 'list'});
        // e.g. a framework re-rendering with new props:  switch to another list.
        setTimeout(() => {
            threePeat.listProp = 'paralympics';
        }, 750);
    </script>
</body>
</html>
